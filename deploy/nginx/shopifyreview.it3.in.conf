# The old hostname redirects to productreviews.it3.in.
# Shopify rejects an app domain that contains "shopify".
# The certificate below stays on the old hostname. Do not point it at the new name.

server {
    listen 80;
    listen [::]:80;
    server_name shopifyreview.it3.in;

    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://productreviews.it3.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shopifyreview.it3.in;

    autoindex off;

    ssl_certificate /etc/letsencrypt/live/shopifyreview.it3.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopifyreview.it3.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://productreviews.it3.in$request_uri;
    }
}
