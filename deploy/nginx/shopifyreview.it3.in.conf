# Prepared server block for shopifyreview.it3.in.
# Do not install or reload this file until production deployment is explicitly authorized.
# It must be a dedicated file. Do not merge it into another site's server block.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shopifyreview.it3.in;

    # Certificate paths are filled by the TLS tool for this hostname only.
    ssl_certificate /etc/letsencrypt/live/shopifyreview.it3.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopifyreview.it3.in/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name shopifyreview.it3.in;
    return 301 https://shopifyreview.it3.in$request_uri;
}
